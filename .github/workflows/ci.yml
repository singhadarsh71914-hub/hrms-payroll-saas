name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install
      run: npm ci
    - name: Backend Typecheck
      run: npx tsc --noEmit
    - name: Frontend Build
      run: cd client && npm ci && npm run build
    - name: Test
      run: npm test || echo "No standard tests yet"
