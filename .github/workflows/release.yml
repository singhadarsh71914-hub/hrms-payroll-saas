name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - name: Build Docker
      run: docker build -t hrms-saas .
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
